name: Six analysis cards and relative volume regression
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check stock-analysis.js
          node --check android-chart.js
          node --check tests/test_six_evidence_cards.cjs
      - name: Six-card evidence and relative-volume behavior
        run: |
          node tests/test_six_evidence_cards.cjs
          node tests/test_relative_volume_fill.cjs
