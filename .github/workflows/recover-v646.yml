name: Recover verified BUILD670 V6.3.46 sources
on:
  push:
    branches: ['import/build670-v646-20261114']
    paths: ['incoming/build670-v646.zip.b64']
permissions:
  contents: write
concurrency:
  group: build670-v646-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode and validate complete source archive
        run: |
          python - <<'PY'
          import base64,hashlib,io,pathlib,zipfile
          raw=base64.b64decode(pathlib.Path('incoming/build670-v646.zip.b64').read_bytes(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='6ac71f9520c87cbe4da3ad2b51bade42e95cf1a13d323f2a8be8f6136d2cd4c6','Source hash mismatch'
          dest=pathlib.Path('/tmp/build670-v646');dest.mkdir()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert len(z.infolist())==1056
              assert z.testzip() is None
              for i in z.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in i.filename
                  assert p.parts[0] not in ('.git','.github')
              z.extractall(dest)
          PY
      - name: Build and verify original Kotlin core
        working-directory: /tmp/build670-v646
        run: python scripts/build_core.py --test
      - name: Python and JavaScript regression tests
        working-directory: /tmp/build670-v646
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_*.py' -q
          for f in tests/test_*.cjs; do node "$f"; done
          python tests/verify_chart_math.py
          python scripts/bump_release.py --check
      - name: Commit verified sources to recovery branch only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/build670-v646-recovery-20261114
          git switch -C recovery FETCH_HEAD
          rsync -a --exclude='.github' /tmp/build670-v646/ ./
          git config user.name 'build670-recovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Recover verified BUILD670 V6.3.46 application sources'
          git push origin HEAD:refs/heads/fix/build670-v646-recovery-20261114
