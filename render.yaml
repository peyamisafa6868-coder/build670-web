# BUILD670 staging-ready Render Blueprint. Manual deploy is intentional.
services:
  - type: web
    name: build670-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    autoDeploy: false
    envVars:
      - key: BUILD670_PUBLIC_SERVER
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: BUILD670_USER_TOKEN_HASHES
        sync: false
# Keep user token hashes in Render's secret environment, never in the repository.
